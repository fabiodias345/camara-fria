# ============================================
# CÂMARA FRIA - Docker Compose Stack
# ============================================
# Services:
#   1. PostgreSQL + PostgREST (API)
#   2. Evolution API (WhatsApp)
#   3. Dashboard (Next.js)
#
# Portas alternativas (portas padrão já em uso):
#   PostgreSQL:  5433 -> 5432 (interno)
#   PostgREST:   3010 -> 3000 (interno)
#   Evolution:   8180 -> 8080 (interno)
#   Dashboard:   3011 -> 3000 (interno)

services:
  # ==========================================
  # POSTGRESQL DATABASE
  # ==========================================
  db:
    image: postgres:17
    container_name: camarafria-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-camara_fria_secret_2026}
      POSTGRES_DB: camarafria
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d camarafria || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "log_min_messages=warning"
      - "-c"
      - "log_statement=all"

  # ==========================================
  # POSTGREST (API REST)
  # ==========================================
  rest:
    image: postgrest/postgrest:v14.12
    container_name: camarafria-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3010:3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-camara_fria_secret_2026}@db:5432/camarafria
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3

  # ==========================================
  # EVOLUTION API (WHATSAPP)
  # ==========================================
  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: camarafria-whatsapp
    restart: unless-stopped
    ports:
      - "8180:8080"
    environment:
      - SERVER_URL=http://localhost:8180
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-camara_fria_evo_key_2026}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://postgres:${POSTGRES_PASSWORD:-camara_fria_secret_2026}@db:5432/camarafria
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - LOG_LEVEL=WARN
      - DEL_INSTANCE=false
      - STORE_CLEANING_INTERVAL=7200
      - STORE_CLEANING_TERMINAL=12
      - Webhook_GLOBAL_ENABLED=false
      - CONFIG_SESSION_PHONE_CLIENT=Câmara Fria Monitor
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - S3_ENABLED=false
    volumes:
      - evolution-instances:/evolution/instances
      - evolution-store:/evolution/store
    depends_on:
      db:
        condition: service_healthy

  # ==========================================
  # DASHBOARD (NEXT.JS)
  # ==========================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: camarafria-dashboard
    restart: unless-stopped
    ports:
      - "3011:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=http://localhost:3010
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder-anon-key
      - NEXT_PUBLIC_WS_URL=ws://localhost:3010/realtime/v1
      - TEMP_MAX_ALERT=8.0
      - TEMP_CRITICAL=12.0
    depends_on:
      - rest

volumes:
  db-data:
  evolution-instances:
  evolution-store:
