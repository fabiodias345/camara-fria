; ============================================
; CÂMARA FRIA - PlatformIO Configuration
; HF-006Enet (Hoffer Automação)
; ESP32 + W5500 Ethernet (HSPI) + RS485 (UART0)
; ============================================

[env:camara-fria]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Libraries
lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    ; ModbusMaster for RS485 communication
    4-20ma/ModbusMaster@^2.0.1
    ; Ethernet W5500 - Generic library with W5500 support
    Ethernet_Generic@^2.6.5

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_EVENT_RUNNING_CORE=1
    ; W5500 via HSPI
    -DSPI_HAS_DMA

; Serial monitor
monitor_filters = esp32_exception_decoder

; =================================================
; NOTA SOBRE A HF-006Enet:
; 
; A placa usa UART0 para RS485 (MAX485)
; A Serial TTL compartilha a mesma UART0
; 
; Durante operação normal, NÃO usar Serial.print()
; se o cabo RS485 estiver conectado!
; 
; Para debug, desconecte o RS485 primeiro.
; 
; GPIOs dedicados (NÃO USAR):
; - GPIO0: W5500 Reset
; - GPIO1: UART0 TX (RS485)
; - GPIO2: W5500 INT
; - GPIO3: UART0 RX (RS485)
; - GPIO5: RS485 DE/RE
; - GPIO12: HSPI MISO (W5500)
; - GPIO13: HSPI MOSI (W5500)
; - GPIO14: HSPI SCK (W5500)
; - GPIO15: W5500 CS
; 
; GPIOs disponíveis para uso:
; - GPIO4,16,17,18,19,23: Relés
; - GPIO21,22: I2C (SDA/SCL)
; - GPIO25,26,27,32,33: Entradas digitais
; - GPIO36,39: Entradas digitais
; =================================================
