<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#07151f"/><style>text{font-family:Arial,sans-serif;fill:#edf8fa}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#abc5cf}.head{font-size:19px;font-weight:700;letter-spacing:2px;fill:#60dff0}.box{fill:#0d2a37;stroke:#42d5ea;stroke-width:2}.tc{fill:#123447;stroke:#64dfed;stroke-width:2}.warn{fill:#3d260e;stroke:#f0b83d;stroke-width:2}.linea{stroke:#45d8ef;stroke-width:6;fill:none}.lineb{stroke:#f2ca45;stroke-width:6;fill:none}.power{stroke:#f2b53f;stroke-width:5;fill:none}.net{stroke:#967aff;stroke-width:5;fill:none}.sig{stroke:#4de0b5;stroke-width:5;fill:none}.alarm{stroke:#ff7a70;stroke-width:5;fill:none}.pin{font-family:monospace;font-size:17px}.small{font-size:14px;fill:#bdd1d7}</style><text x="50" y="52" class="title">Camara Fria — fase 1: HF-006Enet + TC300</text><text x="50" y="82" class="sub">Somente leitura do TC300. O inversor/CLP nao participa desta fase.</text><text x="50" y="145" class="head">ALIMENTACAO E COMUNICACAO</text><rect x="50" y="170" width="330" height="170" rx="18" class="warn"/><text x="120" y="215" class="title">Fonte 12/24 Vcc</text><text x="80" y="265" class="pin">+V  ─────────────── PWR +</text><text x="80" y="305" class="pin">0V  ─────────────── PWR -</text><rect x="570" y="160" width="470" height="230" rx="20" class="tc"/><text x="665" y="210" class="title">Hoffer PLC HF-006Enet</text><text x="620" y="260" class="pin">PWR +  &lt;── fonte 12/24 Vcc</text><text x="620" y="295" class="pin">PWR -  &lt;── 0V comum</text><text x="620" y="335" class="pin">RS-485 A(+) ── R1</text><text x="620" y="370" class="pin">RS-485 B(-) ── R2</text><path d="M380 265H570M380 305H570" class="power"/><rect x="1250" y="170" width="300" height="170" rx="18" class="box"/><text x="1320" y="215" class="title">Wi-Fi</text><text x="1290" y="265" class="pin">HF-006Enet</text><text x="1290" y="305" class="pin">→ API → Supabase</text><path d="M1040 335H1140V265H1250" class="net"/><text x="50" y="465" class="head">BARRAMENTO RS-485 MODBUS RTU — UMA LINHA</text><rect x="50" y="500" width="330" height="220" rx="18" class="box"/><text x="125" y="550" class="title">HF-006Enet</text><text x="95" y="605" class="pin">A (+) ──── R1</text><text x="95" y="650" class="pin">B (-) ──── R2</text><text x="95" y="695" class="small">Mestre Modbus RTU</text><rect x="650" y="500" width="400" height="220" rx="18" class="tc"/><text x="760" y="550" class="title">Controlador TC300</text><text x="700" y="605" class="pin">A (+) &lt;── R1</text><text x="700" y="650" class="pin">B (-) &lt;── R2</text><text x="700" y="695" class="small">Endereco e serial: pendentes</text><path d="M380 605H650" class="linea"/><path d="M380 650H650" class="lineb"/><rect x="1170" y="500" width="380" height="220" rx="18" class="box"/><text x="1270" y="550" class="title">Leituras usadas</text><text x="1210" y="605" class="pin">Temperatura</text><text x="1210" y="645" class="pin">Umidade / Setpoint</text><text x="1210" y="685" class="pin">Alarmes e estado</text><path d="M1050 605H1170M1050 650H1170" class="sig"/><text x="50" y="775" class="head">ENTRADAS E ALARME LOCAL</text><rect x="50" y="800" width="600" height="65" rx="12" class="box"/><text x="75" y="840" class="pin">ED1 + retorno ── interruptor da porta</text><rect x="750" y="800" width="800" height="65" rx="12" class="warn"/><text x="775" y="840" class="pin">SD1 / Relé 1 (C + NA) ── fonte compatível ── buzzer externo</text><path d="M380 800H650" class="sig"/><path d="M1040 800H750" class="alarm"/><text x="50" y="890" class="small">Importante: conectar apenas o TC300. Confirmar o manual do TC300 antes de definir baud rate, paridade, endereco, terminacao e polaridade dos bornes.</text></svg>